name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src

      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      - name: Build release binary
        run: cargo build --release --package vim-forcer

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/vim-forcer dist/vim-forcer-linux-x86_64
          tar -C dist -czf dist/vim-forcer-linux-x86_64.tar.gz vim-forcer-linux-x86_64
          sha256sum dist/vim-forcer-linux-x86_64.tar.gz > dist/vim-forcer-linux-x86_64.tar.gz.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/vim-forcer-linux-x86_64.tar.gz \
            dist/vim-forcer-linux-x86_64.tar.gz.sha256
